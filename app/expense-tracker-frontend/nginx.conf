server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Ingress's ALB health check path (alb.ingress.kubernetes.io/healthcheck-path)
    # applies to every target group the Ingress creates, including this one —
    # respond here too so the shared backend/frontend health check config works.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
