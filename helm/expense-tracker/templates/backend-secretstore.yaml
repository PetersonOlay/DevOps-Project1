{{/* Lets External Secrets Operator read Secrets Manager on the app's behalf,
     reusing the app's existing IRSA-annotated ServiceAccount (module.irsa_app)
     instead of granting the shared ESO controller any standing AWS access. */}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "expense-tracker.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.backend.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
