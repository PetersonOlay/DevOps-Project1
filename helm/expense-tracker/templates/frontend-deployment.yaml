apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "expense-tracker.frontend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "expense-tracker.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "expense-tracker.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "expense-tracker.frontend.name" . }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
