{{/* Single ALB shared by both services, split by path so there's one
     origin and no CORS config needed on the frontend. */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "expense-tracker.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          # Most-specific paths first — the AWS Load Balancer Controller
          # evaluates rules in the order listed here.
          - path: /expenses
            pathType: Prefix
            backend:
              service:
                name: {{ include "expense-tracker.backend.name" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "expense-tracker.backend.name" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "expense-tracker.frontend.name" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
