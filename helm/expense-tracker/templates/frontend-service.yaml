{{/* ClusterIP Service in front of the frontend Deployment. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "expense-tracker.frontend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "expense-tracker.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
