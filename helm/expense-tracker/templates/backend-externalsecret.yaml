{{/* Syncs the RDS-managed DB credential secret (config.dbSecretArn) into a
     native Kubernetes Secret, consumed by backend-deployment.yaml's envFrom.
     Replaces the old pattern where the app called the AWS SDK directly. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "expense-tracker.name" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "expense-tracker.name" . }}
    kind: SecretStore
  target:
    name: {{ include "expense-tracker.name" . }}-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.config.dbSecretArn }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.config.dbSecretArn }}
        property: password
