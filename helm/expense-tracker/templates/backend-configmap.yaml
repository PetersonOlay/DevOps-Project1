{{/* Non-secret backend config, injected into the Deployment via envFrom. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "expense-tracker.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_SECRET_ARN: {{ .Values.config.dbSecretArn | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
