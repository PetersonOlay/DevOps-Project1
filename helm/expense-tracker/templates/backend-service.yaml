{{/* ClusterIP Service in front of the backend Deployment; port named
     "http" so the monitoring ServiceMonitor can target it by name. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "expense-tracker.backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "expense-tracker.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
