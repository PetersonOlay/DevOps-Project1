{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "expense-tracker.name" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
  annotations:
    # Job specs are immutable, so a plain "helm upgrade" (image tag changes
    # every deploy) can't patch this in place. Running it as a post-install/
    # post-upgrade hook makes Helm delete the previous Job and create a fresh
    # one instead. Post- (not pre-) so the ServiceAccount/ConfigMap this Job
    # depends on are already installed by the time it runs.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["node", "src/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "expense-tracker.name" . }}-config
            - secretRef:
                name: {{ include "expense-tracker.name" . }}-db-credentials
{{- end }}
