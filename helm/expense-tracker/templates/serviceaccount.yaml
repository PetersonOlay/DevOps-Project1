{{/* Backend's ServiceAccount, IRSA-annotated so its pods can assume the
     scoped app IAM role (S3 + Secrets Manager access). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
