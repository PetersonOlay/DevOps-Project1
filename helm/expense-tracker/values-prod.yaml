# prod-environment overrides, layered on top of values.yaml. Fill in every
# REPLACE_WITH_* placeholder from Terraform outputs before the first deploy.
# Fill in from: terraform -chdir=../../environments/prod output
backend:
  image:
    repository: "REPLACE_WITH_ECR_REPOSITORY_URL"
    tag: "prod"

replicaCount: 3

serviceAccount:
  roleArn: "REPLACE_WITH_PROD_IRSA_APP_ROLE_ARN"

config:
  dbHost: "REPLACE_WITH_PROD_RDS_ENDPOINT"
  dbPort: "5432"
  dbName: "expenses"
  dbSecretArn: "REPLACE_WITH_PROD_RDS_MASTER_USER_SECRET_ARN"
  s3Bucket: "REPLACE_WITH_PROD_APP_S3_BUCKET_NAME"
  awsRegion: "us-east-1"
  appEnv: "prod"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: "REPLACE_WITH_FRONTEND_ECR_REPOSITORY_URL"
    tag: "prod"
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
