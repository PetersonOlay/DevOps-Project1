# Chart-wide defaults; values-<env>.yaml overrides these per environment.
# Backend image:
backend:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  name: app
  roleArn: ""

config:
  dbHost: ""
  dbPort: "5432"
  dbName: "expenses"
  dbSecretArn: ""
  s3Bucket: ""
  awsRegion: "us-east-1"
  appEnv: "dev"

# ExternalSecret sync interval for DB credentials (backend-externalsecret.yaml).
externalSecrets:
  refreshInterval: "1m"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz

migrationJob:
  enabled: true

# HorizontalPodAutoscaler for the backend. When enabled, replicaCount above
# is ignored (the HPA controller owns the replica count instead).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Frontend image/config:
frontend:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  service:
    port: 80
    targetPort: 80

  # Same as the backend's autoscaling block above.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
