# Fill in from: terraform -chdir=../../environments/stg output
image:
  repository: "REPLACE_WITH_ECR_REPOSITORY_URL"
  tag: "stg"

replicaCount: 2

serviceAccount:
  roleArn: "REPLACE_WITH_STG_IRSA_APP_ROLE_ARN"

config:
  dbHost: "REPLACE_WITH_STG_RDS_ENDPOINT"
  dbPort: "5432"
  dbName: "expenses"
  dbSecretArn: "REPLACE_WITH_STG_RDS_MASTER_USER_SECRET_ARN"
  s3Bucket: "REPLACE_WITH_STG_APP_S3_BUCKET_NAME"
  awsRegion: "us-east-1"
  appEnv: "stg"

frontend:
  image:
    repository: "REPLACE_WITH_FRONTEND_ECR_REPOSITORY_URL"
    tag: "stg"
  replicaCount: 2
