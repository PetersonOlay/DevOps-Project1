# Helm values for prometheus-community/kube-prometheus-stack — manually
# helm-installed (not Terraform-managed), see monitoring/README.md.
prometheus:
  prometheusSpec:
    # Select ServiceMonitors cluster-wide, not just ones labeled with this
    # Helm release — simpler than requiring every ServiceMonitor to carry a
    # matching `release:` label on a single-cluster setup like this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  defaultDashboardsEnabled: true

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

  # Admin password is auto-generated by the chart into a Secret
  # (kube-prometheus-stack-grafana) — see monitoring/README.md to retrieve it.

  # IRSA role scoped to read-only CloudWatch Logs/Metrics access (see
  # environments/dev/main.tf: module.irsa_grafana_cloudwatch). Annotating the
  # chart-managed service account here (rather than patching it after the
  # fact) means it's present from pod creation, which IRSA's mutating webhook
  # requires to inject credentials.
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::395675597879:role/expense-platform-dev-grafana-cloudwatch"

  additionalDataSources:
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: us-east-1
      editable: true

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
    path: /
    pathType: Prefix
    hosts:
      - ""

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

alertmanager:
  enabled: true
