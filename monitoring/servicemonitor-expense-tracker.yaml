apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: expense-tracker
  namespace: expense-tracker-dev
  labels:
    app: expense-tracker
spec:
  namespaceSelector:
    matchNames:
      - expense-tracker-dev
  selector:
    matchLabels:
      app: expense-tracker-dev
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
