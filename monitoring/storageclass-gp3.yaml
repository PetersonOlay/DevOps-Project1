# CSI-backed StorageClass — the cluster's default "gp2" class uses the
# legacy in-tree provisioner, which no longer works on this EKS version.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
