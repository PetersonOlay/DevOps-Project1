# Tells Prometheus Operator to scrape the backend's /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: expense-tracker
  namespace: expense-tracker-stg
  labels:
    app: expense-tracker
spec:
  namespaceSelector:
    matchNames:
      - expense-tracker-stg
  selector:
    matchLabels:
      app: expense-tracker-stg
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
