# Build, push, and deploy the expense-tracker backend + frontend to EKS.
# Auto-runs against "dev" on every push to main; workflow_dispatch lets you
# target dev/stg/prod manually. Each environment authenticates with its own
# scoped IAM user (see modules/ci-deployer) via that GitHub Environment's
# secrets/variables.
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg
          - prod

permissions:
  contents: write # needed so the deploy job can commit the bumped image tags back to main

jobs:
  # Run the backend's test suite before building/deploying anything.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: app/expense-tracker

      - name: Run tests
        run: npm test
        working-directory: app/expense-tracker

  # Build both container images and push them to their ECR repos, tagged
  # with the environment + a timestamp so every build is unique/traceable.
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      backend_tag: ${{ steps.tag.outputs.backend_tag }}
      frontend_tag: ${{ steps.tag.outputs.frontend_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tags
        id: tag
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "backend_tag=app-${{ github.event.inputs.environment || 'dev' }}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=web-${{ github.event.inputs.environment || 'dev' }}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}:${{ steps.tag.outputs.backend_tag }} app/expense-tracker/
          docker push ${{ vars.ECR_REGISTRY }}:${{ steps.tag.outputs.backend_tag }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ vars.FRONTEND_ECR_REGISTRY }}:${{ steps.tag.outputs.frontend_tag }} app/expense-tracker-frontend/
          docker push ${{ vars.FRONTEND_ECR_REGISTRY }}:${{ steps.tag.outputs.frontend_tag }}

  # Point the Helm chart at the new images and roll them out to the cluster.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ vars.AWS_REGION }}

      # Bump both image tags in the env's values file with yq (not sed —
      # the two tag fields live at different nesting levels).
      - name: Update image tags in values file
        run: |
          VALUES_FILE=helm/expense-tracker/values-${{ github.event.inputs.environment || 'dev' }}.yaml
          yq -i '
            .image.tag = "${{ needs.build-and-push.outputs.backend_tag }}" |
            .frontend.image.tag = "${{ needs.build-and-push.outputs.frontend_tag }}"
          ' "$VALUES_FILE"

      # Keep the values file in git in sync with what's actually deployed.
      - name: Commit updated tags back to repo
        run: |
          VALUES_FILE=helm/expense-tracker/values-${{ github.event.inputs.environment || 'dev' }}.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$VALUES_FILE"
          git commit -m "ci: update tags - backend:${{ needs.build-and-push.outputs.backend_tag }} frontend:${{ needs.build-and-push.outputs.frontend_tag }}" || true
          git push

      - name: Install/Upgrade Helm release
        run: |
          helm upgrade --install expense-tracker helm/expense-tracker \
            --namespace ${{ vars.NAMESPACE }} \
            -f helm/expense-tracker/values.yaml \
            -f helm/expense-tracker/values-${{ github.event.inputs.environment || 'dev' }}.yaml \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ vars.NAMESPACE }}
          kubectl get ingress -n ${{ vars.NAMESPACE }}
