name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg
          - prod

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: app/expense-tracker

      - name: Run tests
        run: npm test
        working-directory: app/expense-tracker

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "image_tag=app-${{ github.event.inputs.environment || 'dev' }}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}:${{ steps.tag.outputs.image_tag }} app/expense-tracker/
          docker push ${{ vars.ECR_REGISTRY }}:${{ steps.tag.outputs.image_tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER }} --region ${{ vars.AWS_REGION }}

      - name: Update image tag in values file
        run: |
          VALUES_FILE=helm/expense-tracker/values-${{ github.event.inputs.environment || 'dev' }}.yaml
          sed -i "0,/tag: .*/s/tag: .*/tag: \"${{ needs.build-and-push.outputs.image_tag }}\"/" "$VALUES_FILE"

      - name: Commit updated tag back to repo
        run: |
          VALUES_FILE=helm/expense-tracker/values-${{ github.event.inputs.environment || 'dev' }}.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$VALUES_FILE"
          git commit -m "ci: update image tag to ${{ needs.build-and-push.outputs.image_tag }}" || true
          git push

      - name: Install/Upgrade Helm release
        run: |
          helm upgrade --install expense-tracker helm/expense-tracker \
            --namespace ${{ vars.NAMESPACE }} \
            --create-namespace \
            -f helm/expense-tracker/values.yaml \
            -f helm/expense-tracker/values-${{ github.event.inputs.environment || 'dev' }}.yaml \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ vars.NAMESPACE }}
          kubectl get ingress -n ${{ vars.NAMESPACE }}
